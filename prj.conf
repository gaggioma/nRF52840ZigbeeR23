CONFIG_NCS_SAMPLES_DEFAULTS=n

CONFIG_GPIO=y

#Used for log. Disable for power optimization
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y


CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y

#Channel
CONFIG_ZIGBEE_CHANNEL=25

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=n

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Networking
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# ADC
CONFIG_ADC=y

# Enable API for powering down unused RAM parts
#https://nrfconnectdocs.nordicsemi.com/addons/zigbee-r23/latest/configuring.html#sleepy-end-device-behavior
CONFIG_RAM_POWER_DOWN_LIBRARY=y

#power optimization
#https://nrfconnectdocs.nordicsemi.com/ncs/latest/nrf/test_and_optimize/optimizing/power_general.html#enable-device-power-management-module
CONFIG_PM_DEVICE=y

